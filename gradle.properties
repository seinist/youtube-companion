# Set to true to enable the Gradle Daemon
org.gradle.daemon=true

# R8 runs in the Gradle JVM and needs headroom for release optimization.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

# Bound concurrent work to reduce peak memory during release builds.
org.gradle.parallel=false
org.gradle.workers.max=2

# Enable configuration caching
org.gradle.configuration-cache=true

# Required for all AndroidX dependencies used in this project
android.useAndroidX=true
android.nonTransitiveRClass=true
